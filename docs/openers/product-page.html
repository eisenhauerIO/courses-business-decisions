<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Product page</title>
<style>
  @page { size: 1600px 900px; margin: 0; }
  html, body { margin: 0; width: 1600px; height: 900px; background: #fff; overflow: hidden; }
  svg { display: block; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #1a1a2e; }
  .mark { fill: none; stroke: #d97706; stroke-width: 3; }
  .dot { fill: #d97706; }
  .num { fill: #fff; font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  .heading { font-size: 30px; font-weight: 600; }
  .legend-num { fill: #d97706; }
  .legend-text { font-size: 20px; }
</style>
</head>
<body>
<!-- Boxes are in the screenshot's own 1112x723 pixel space (the inner <g> transform). -->
<svg width="1600" height="900" viewBox="0 0 1600 900">
  <g transform="translate(24,45) scale(1.12)">
    <rect x="0" y="0" width="1112" height="723" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <image href="../source/_static/product-data.png" x="0" y="0" width="1112" height="723"/>

    <rect class="mark" x="14" y="12" width="510" height="26" rx="4"/>
    <rect class="mark" x="14" y="56" width="604" height="592" rx="4"/>
    <rect class="mark" x="626" y="60" width="440" height="88" rx="4"/>
    <rect class="mark" x="626" y="148" width="140" height="40" rx="4"/>
    <rect class="mark" x="626" y="190" width="150" height="50" rx="4"/>
    <rect class="mark" x="626" y="252" width="122" height="84" rx="4"/>
    <rect class="mark" x="626" y="440" width="456" height="128" rx="4"/>
    <rect class="mark" x="626" y="576" width="320" height="136" rx="4"/>

    <g>
      <circle class="dot" cx="14" cy="12" r="13"/><text class="num" x="14" y="12">1</text>
      <circle class="dot" cx="14" cy="56" r="13"/><text class="num" x="14" y="56">2</text>
      <circle class="dot" cx="1066" cy="60" r="13"/><text class="num" x="1066" y="60">3</text>
      <circle class="dot" cx="766" cy="155" r="13"/><text class="num" x="766" y="155">4</text>
      <circle class="dot" cx="776" cy="200" r="13"/><text class="num" x="776" y="200">5</text>
      <circle class="dot" cx="748" cy="262" r="13"/><text class="num" x="748" y="262">6</text>
      <circle class="dot" cx="1082" cy="440" r="13"/><text class="num" x="1082" y="440">7</text>
      <circle class="dot" cx="946" cy="576" r="13"/><text class="num" x="946" y="576">8</text>
    </g>
  </g>

  <g transform="translate(1296,150)">
    <g class="legend-text">
      <circle class="legend-num" cx="14" cy="0" r="16"/><text class="num" x="14" y="0" style="font-size:17px">1</text>
      <text x="44" y="8">Category Path</text>
      <circle class="legend-num" cx="14" cy="70" r="16"/><text class="num" x="14" y="70" style="font-size:17px">2</text>
      <text x="44" y="78">Images and Video</text>
      <circle class="legend-num" cx="14" cy="140" r="16"/><text class="num" x="14" y="140" style="font-size:17px">3</text>
      <text x="44" y="148">Title</text>
      <circle class="legend-num" cx="14" cy="210" r="16"/><text class="num" x="14" y="210" style="font-size:17px">4</text>
      <text x="44" y="218">Brand and Ratings</text>
      <circle class="legend-num" cx="14" cy="280" r="16"/><text class="num" x="14" y="280" style="font-size:17px">5</text>
      <text x="44" y="288">Badges and Social Proof</text>
      <circle class="legend-num" cx="14" cy="350" r="16"/><text class="num" x="14" y="350" style="font-size:17px">6</text>
      <text x="44" y="358">Price and Deal</text>
      <circle class="legend-num" cx="14" cy="420" r="16"/><text class="num" x="14" y="420" style="font-size:17px">7</text>
      <text x="44" y="428">Variants</text>
      <circle class="legend-num" cx="14" cy="490" r="16"/><text class="num" x="14" y="490" style="font-size:17px">8</text>
      <text x="44" y="498">Structured Attributes</text>
    </g>
  </g>
</svg>
</body>
</html>
