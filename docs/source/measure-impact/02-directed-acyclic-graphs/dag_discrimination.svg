<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="520" height="330" fill="white"/>

  <!-- Gender Node - left -->
  <circle cx="115" cy="120" r="45" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <text x="115" y="118" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Gender</text>
  <text x="115" y="138" text-anchor="middle" font-family="Arial" font-size="12">(D)</text>

  <!-- Occupation Node - center -->
  <circle cx="260" cy="120" r="45" fill="#98FB98" stroke="#333" stroke-width="2"/>
  <text x="260" y="118" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Occupation</text>
  <text x="260" y="138" text-anchor="middle" font-family="Arial" font-size="12">(M)</text>

  <!-- Wages Node - right -->
  <circle cx="405" cy="120" r="45" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <text x="405" y="118" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Wages</text>
  <text x="405" y="138" text-anchor="middle" font-family="Arial" font-size="12">(Y)</text>

  <!-- Ability Node - bottom, unobserved -->
  <circle cx="332" cy="225" r="45" fill="#D3D3D3" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="332" y="223" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Ability</text>
  <text x="332" y="243" text-anchor="middle" font-family="Arial" font-size="12">(A)</text>

  <!-- Edge: Gender → Occupation -->
  <line x1="160" y1="120" x2="205" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Edge: Occupation → Wages -->
  <line x1="305" y1="120" x2="350" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Edge: Gender → Wages (curved) -->
  <path d="M 150 85 Q 260 20 370 85" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Edge: Ability → Occupation -->
  <line x1="307" y1="188" x2="286" y2="157" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Edge: Ability → Wages -->
  <line x1="358" y1="188" x2="379" y2="157" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Legend -->
  <text x="260" y="300" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">M is a mediator on D → M → Y</text>
  <text x="260" y="317" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">and a collider on D → M ← A → Y</text>
</svg>
