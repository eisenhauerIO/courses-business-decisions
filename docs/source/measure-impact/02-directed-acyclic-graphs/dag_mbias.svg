<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 345" width="520" height="345">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="520" height="345" fill="white"/>

  <!-- Nodes -->
  <!-- Engagement (A) - top left -->
  <circle cx="110" cy="70" r="50" fill="#F4A460" stroke="#333" stroke-width="2"/>
  <text x="110" y="66" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Engagement</text>
  <text x="110" y="85" text-anchor="middle" font-family="Arial" font-size="12">(A)</text>

  <!-- Fulfillment (B) - top right -->
  <circle cx="410" cy="70" r="50" fill="#F4A460" stroke="#333" stroke-width="2"/>
  <text x="410" y="66" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Fulfillment</text>
  <text x="410" y="85" text-anchor="middle" font-family="Arial" font-size="12">(B)</text>

  <!-- Tickets (C) - center, collider -->
  <circle cx="260" cy="165" r="50" fill="#FFD700" stroke="#333" stroke-width="2"/>
  <text x="260" y="161" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Tickets</text>
  <text x="260" y="180" text-anchor="middle" font-family="Arial" font-size="12">(C)</text>

  <!-- Optimization (D) - bottom left -->
  <circle cx="110" cy="260" r="50" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <text x="110" y="256" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Optimization</text>
  <text x="110" y="275" text-anchor="middle" font-family="Arial" font-size="12">(D)</text>

  <!-- Sales (Y) - bottom right -->
  <circle cx="410" cy="260" r="50" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <text x="410" y="256" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Sales</text>
  <text x="410" y="275" text-anchor="middle" font-family="Arial" font-size="12">(Y)</text>

  <!-- Edges -->
  <!-- A → D -->
  <line x1="110" y1="120" x2="110" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- A → C -->
  <line x1="152" y1="97" x2="218" y2="138" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- B → C -->
  <line x1="368" y1="97" x2="302" y2="138" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- B → Y -->
  <line x1="410" y1="120" x2="410" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- D → Y -->
  <line x1="160" y1="260" x2="360" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Legend -->
  <text x="260" y="335" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">C is a collider on the backdoor path D ← A → C ← B → Y. Conditioning on C opens it.</text>
</svg>
