<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 290" width="540" height="290">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="540" height="290" fill="white"/>

  <!-- Edges -->
  <!-- A → D -->
  <line x1="90" y1="82" x2="90" y2="208" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- A → C -->
  <line x1="119" y1="64" x2="241" y2="126" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- B → C -->
  <line x1="421" y1="64" x2="299" y2="126" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- B → Y -->
  <line x1="450" y1="82" x2="450" y2="208" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- D → Y -->
  <line x1="122" y1="240" x2="418" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Nodes -->
  <circle cx="90" cy="50" r="32" fill="#F4A460" stroke="#333" stroke-width="2"/>
  <text x="90" y="57" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">A</text>
  <circle cx="450" cy="50" r="32" fill="#F4A460" stroke="#333" stroke-width="2"/>
  <text x="450" y="57" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">B</text>
  <circle cx="270" cy="140" r="32" fill="#F4A460" stroke="#333" stroke-width="2"/>
  <text x="270" y="147" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">C</text>
  <circle cx="90" cy="240" r="32" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <text x="90" y="247" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">D</text>
  <circle cx="450" cy="240" r="32" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <text x="450" y="247" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Y</text>
</svg>
