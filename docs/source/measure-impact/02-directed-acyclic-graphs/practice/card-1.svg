<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 290" width="540" height="290">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="540" height="290" fill="white"/>

  <!-- Edges -->
  <!-- X → D -->
  <line x1="244" y1="79" x2="116" y2="171" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- X → Y -->
  <line x1="296" y1="79" x2="424" y2="171" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- D → Y -->
  <line x1="122" y1="190" x2="418" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Nodes -->
  <circle cx="90" cy="190" r="32" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <text x="90" y="197" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">D</text>
  <circle cx="450" cy="190" r="32" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <text x="450" y="197" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Y</text>
  <circle cx="270" cy="60" r="32" fill="#F4A460" stroke="#333" stroke-width="2"/>
  <text x="270" y="67" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">X</text>
</svg>
