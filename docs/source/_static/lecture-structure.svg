<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 230">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .box { fill: #f8f9fa; stroke: #93c5fd; stroke-width: 2; }
      .title { font-size: 16px; font-weight: 600; fill: #1a1a2e; }
      .caption { font-size: 14px; fill: #6b7280; }
      .arrow { stroke: #cbd5e1; stroke-width: 2; }
      .arrow-head { fill: #cbd5e1; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; }
      .badge-text { font-size: 11px; font-weight: 600; fill: #1d4ed8; letter-spacing: 0.05em; }
    </style>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <path class="arrow-head" d="M0,0 L10,4 L0,8 Z"/>
    </marker>
  </defs>

  <!-- Step 1: Business Context -->
  <rect class="box" x="65" y="70" width="150" height="84" rx="8"/>
  <text class="title" x="140" y="108" text-anchor="middle">Business</text>
  <text class="title" x="140" y="128" text-anchor="middle">Context</text>
  <text class="caption" x="140" y="184" text-anchor="middle">Frame causal</text>
  <text class="caption" x="140" y="202" text-anchor="middle">question</text>

  <line class="arrow" x1="219" y1="112" x2="259" y2="112" marker-end="url(#arrow)"/>

  <!-- Step 2: Simulate Data -->
  <rect class="badge" x="265" y="38" width="150" height="22" rx="11"/>
  <text class="badge-text" x="340" y="53" text-anchor="middle">SIMULATOR</text>
  <rect class="box" x="265" y="70" width="150" height="84" rx="8"/>
  <text class="title" x="340" y="108" text-anchor="middle">Simulate</text>
  <text class="title" x="340" y="128" text-anchor="middle">Data</text>
  <text class="caption" x="340" y="184" text-anchor="middle">Generate data with</text>
  <text class="caption" x="340" y="202" text-anchor="middle">known ground truth</text>

  <line class="arrow" x1="419" y1="112" x2="459" y2="112" marker-end="url(#arrow)"/>

  <!-- Step 3: Measure Impact -->
  <rect class="badge" x="465" y="38" width="150" height="22" rx="11"/>
  <text class="badge-text" x="540" y="53" text-anchor="middle">IMPACT ENGINE</text>
  <rect class="box" x="465" y="70" width="150" height="84" rx="8"/>
  <text class="title" x="540" y="108" text-anchor="middle">Measure</text>
  <text class="title" x="540" y="128" text-anchor="middle">Impact</text>
  <text class="caption" x="540" y="184" text-anchor="middle">Naive comparison</text>
  <text class="caption" x="540" y="202" text-anchor="middle">&#x2192; Causal method</text>

  <line class="arrow" x1="619" y1="112" x2="659" y2="112" marker-end="url(#arrow)"/>

  <!-- Step 4: Evaluate Performance -->
  <rect class="box" x="665" y="70" width="150" height="84" rx="8"/>
  <text class="title" x="740" y="108" text-anchor="middle">Evaluate</text>
  <text class="title" x="740" y="128" text-anchor="middle">Performance</text>
  <text class="caption" x="740" y="184" text-anchor="middle">Compare methods</text>
  <text class="caption" x="740" y="202" text-anchor="middle">to ground truth</text>

  <line class="arrow" x1="819" y1="112" x2="859" y2="112" marker-end="url(#arrow)"/>

  <!-- Step 5: Tune Parameters -->
  <rect class="box" x="865" y="70" width="150" height="84" rx="8"/>
  <text class="title" x="940" y="108" text-anchor="middle">Tune</text>
  <text class="title" x="940" y="128" text-anchor="middle">Parameters</text>
  <text class="caption" x="940" y="184" text-anchor="middle">Adjust method</text>
  <text class="caption" x="940" y="202" text-anchor="middle">configuration</text>
</svg>
